spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/sap;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      continue-on-error: true
  h2:
    console:
      enabled: true
      path: /h2
